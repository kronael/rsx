[package]
name = "rsx-matching"
version = "0.2.0"
edition = "2021"
description = "Single-symbol matching-engine tile with FIFO matching, WAL persistence, deduplication, recovery, and fixed-capacity hot-path state."
repository = "https://github.com/kronael/rsx"
license = "GPL-3.0-only"
keywords = ["matching-engine", "exchange", "trading", "low-latency", "orderbook"]
categories = ["finance", "concurrency"]
readme = "README.md"

[dependencies]
apache-avro = "0.21"
rsx-types = { version = "0.2.0", path = "../rsx-types" }
rsx-log = { version = "0.2.0", path = "../rsx-log" }
rsx-book = { version = "0.2.0", path = "../rsx-book" }
rsx-cast = { version = "0.5.2", path = "../rsx-cast" }
rsx-messages = { version = "0.2.0", path = "../rsx-messages" }
rsx-health = { version = "0.1.0", path = "../rsx-health" }
rtrb = "0.3"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-postgres = "0.7"
libc = "0.2"

[features]
# Compile in the per-stage latency trace (latency_sample! macro). Off by
# default = zero hot-path cost. Build with --features latency-trace to profile.
latency-trace = []

[dev-dependencies]
criterion = "0.5"
core_affinity = "0.8"
tempfile = "3"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "process_order_bench"
harness = false

[[bench]]
name = "match_n_levels_bench"
harness = false

[[bench]]
name = "match_depth_bench"
harness = false

[[bench]]
name = "match_by_type_bench"
harness = false

[[bench]]
name = "wal_replay_bench"
harness = false

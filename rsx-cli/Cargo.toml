[package]
name = "rsx-cli"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "rsx-cli"

[[bin]]
name = "rsx-cli"
path = "src/main.rs"

[[bin]]
name = "bench-match-rt"
path = "src/bin/bench_match_rt.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
rsx-cast = { path = "../rsx-cast" }
rsx-messages = { path = "../rsx-messages" }
rsx-book = { path = "../rsx-book" }
rsx-marketdata = { path = "../rsx-marketdata" }
rsx-matching = { path = "../rsx-matching" }
rsx-risk = { path = "../rsx-risk" }
rsx-types = { path = "../rsx-types" }
rustc-hash = "2"
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "signal"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.24"
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
rsx-gateway = { path = "../rsx-gateway" }
tempfile = "3"
testcontainers = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }

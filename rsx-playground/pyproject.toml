[project]
name = "rsx-playground"
version = "0.1.0"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "psutil",
    "jinja2",
    "asyncpg",
    "python-multipart",
    "pytest",
    "aiohttp",
    "httpx",
    "pyjwt",
    "pytest-asyncio>=1.3.0",
    "websockets>=16.0",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
